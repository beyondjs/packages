js-bundle:
  description: JavaScript module
  headers:
    Cache-Control:
      schema: { type: string }
    ETag:
      schema: { type: string }
    Link:
      schema: { type: string }
    SourceMap:
      schema: { type: string }
    X-SourceMap:
      schema: { type: string }
    Content-Type:
      schema:
        type: string
        example: application/javascript; charset=utf-8
  content:
    application/javascript:
      schema:
        type: string
      examples:
        esm:
          summary: ESM bundle example
          value: |
            // Generated by BeyondJS
            export function hello(){console.log("hi")}

not-modified:
  description: Resource not modified (ETag matched)

bad-request:
  description: Invalid parameters
  content:
    application/json:
      schema:
        type: object
        properties:
          message: { type: string, example: "Invalid query parameter 'format'" }

not-found:
  description: Module or artifact not found
  content:
    application/json:
      schema:
        type: object
        properties:
          message: { type: string, example: 'Module core/router not found' }
