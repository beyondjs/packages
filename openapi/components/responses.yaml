js-bundle:
  description: JavaScript module bundle
  headers:
    ETag:
      schema: { type: string }
      description: ETag equal to the SHA-256 digest of the artifact
    Cache-Control:
      schema: { type: string }
      description: Strong caching for immutable artifacts
    Link:
      schema: { type: string }
      description: Optional links to related resources (e.g. .d.ts, CSS)
    SourceMap:
      schema: { type: string }
      description: Legacy header for source map location
    X-SourceMap:
      schema: { type: string }
      description: Alternative legacy header for source map location
    Content-Type:
      schema:
        type: string
        example: application/javascript; charset=utf-8
      description: MIME type of the response
  content:
    application/javascript:
      schema:
        type: string
      examples:
        esm:
          summary: Example of an ESM bundle
          value: |
            // Generated by BeyondJS
            export function hello(){console.log("hi")}

not-modified:
  description: Resource not modified (ETag matched)

bad-request:
  description: Invalid request parameters
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: "Invalid query parameter 'format'"

not-found:
  description: Module or artifact not found
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Module core/router not found'
