rid:
  name: rid
  in: path
  required: true
  schema:
    type: string
    pattern: '[a-z0-9._-]+'
  description: Registered registry id (e.g. "verdaccio")

scope:
  name: scope
  in: path
  required: true
  description: NPM scope without '@'
  schema:
    type: string
    pattern: '[a-z0-9._-]+'

pkg:
  name: pkg
  in: path
  required: true
  description: Package name
  schema:
    type: string
    pattern: '[a-z0-9._-]+'

version:
  name: version
  in: path
  required: true
  description: Semver version or tag
  schema:
    type: string

git-host:
  name: host
  in: path
  required: true
  schema: { type: string }
  description: Git host (e.g. github.com, gitlab.com)

git-owner:
  name: owner
  in: path
  required: true
  schema: { type: string }
  description: Git organization or user

git-repo:
  name: repo
  in: path
  required: true
  schema: { type: string }
  description: Git repository name

git-commit:
  name: commit
  in: path
  required: true
  schema:
    type: string
    pattern: '^[0-9a-fA-F]{7,40}$'
  description: Git commit hash (7–40 hex chars)

sha256:
  name: digest
  in: path
  required: true
  description: |
    Immutable artifact identifier (SHA-256 hash). Two formats are accepted:
    - Hex: 64 hex chars, prefixed with 'sha256-'
    - Base64URL without padding: 43 chars, prefixed with 'sha256u-'

    Examples:  
    • sha256-3f786850e387550fdab836ed7e6dc881de23001b…  
    • sha256u-2jmj7l5rSw0yVb_vlWAYkK_YBwk
  schema:
    type: string
    oneOf:
      - pattern: '^sha256-[0-9a-f]{64}$'
      - pattern: '^sha256u-[A-Za-z0-9_-]{43}$'

registry-host:
  name: host
  in: path
  required: true
  schema: { type: string }
  description: Registry host (e.g. npm.pkg.github.com, registry.acme.local)

registry-namespace:
  name: namespace
  in: path
  required: true
  schema: { type: string }
  description: Registry namespace/organization (when applicable)

mod:
  name: mod
  in: path
  required: true
  description: Module path inside the package (e.g. "core/router")
  schema:
    type: string

target:
  name: target
  in: query
  required: true
  description: Bundle target environment
  schema:
    type: string
    enum: [browser, node]

format:
  name: format
  in: query
  required: true
  description: Bundle format
  schema:
    type: string
    enum: [esm, cjs, system]

env:
  name: env
  in: query
  required: false
  description: Build mode
  schema:
    type: string
    enum: [production, development]
    default: production

min:
  name: min
  in: query
  required: false
  description: Minify output
  schema:
    type: boolean
    default: true

sourcemap:
  name: sourcemap
  in: query
  required: false
  description: Source map type
  schema:
    type: string
    enum: [inline, external, none]
    default: external

types:
  name: types
  in: query
  required: false
  description: If true, adds a Link header to the module's .d.ts file
  schema:
    type: boolean
    default: false

css:
  name: css
  in: query
  required: false
  description: If true, adds a Link header to the stylesheet (and optional ESM import)
  schema:
    type: boolean
    default: false
