get:
  tags: [Modules]
  summary: Serve module bundle from Git (by commit)
  description: Returns the JavaScript bundle of the requested module from a Git repository identified by commit hash.
  parameters:
    - $ref: '../components/parameters.yaml#/git-host'
    - $ref: '../components/parameters.yaml#/git-owner'
    - $ref: '../components/parameters.yaml#/git-repo'
    - $ref: '../components/parameters.yaml#/git-commit'
    - $ref: '../components/parameters.yaml#/mod'
    - $ref: '../components/parameters.yaml#/target'
    - $ref: '../components/parameters.yaml#/format'
    - $ref: '../components/parameters.yaml#/env'
    - $ref: '../components/parameters.yaml#/min'
    - $ref: '../components/parameters.yaml#/sourcemap'
    - $ref: '../components/parameters.yaml#/types'
    - $ref: '../components/parameters.yaml#/css'
  responses:
    '200': { $ref: '../components/responses.yaml#/js-bundle' }
    '304': { $ref: '../components/responses.yaml#/not-modified' }
    '400': { $ref: '../components/responses.yaml#/bad-request' }
    '404': { $ref: '../components/responses.yaml#/not-found' }
